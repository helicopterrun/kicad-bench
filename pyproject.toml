[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-bench"
version = "0.1.0"
description = "Generic, config-driven KiCad-10 workflow & PCB-design workbench (read-first quality gates + layout/DFM prep)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "helicopterrun" }]
# Lightweight core: KiCad work is done by shelling out to `kicad-cli`. The one core
# dependency is `sexpdata`, a tiny pure-Python (zero-transitive-dep) S-expression reader
# used to parse `.kicad_pcb`/`.kicad_sch` by structure instead of fragile field-order
# regex. Anything heavier or feature-specific goes in an optional extra below rather than
# being imported undeclared; e.g. `pip install kicad-bench[xlsx]`.
dependencies = ["sexpdata"]

[project.optional-dependencies]
xlsx = ["openpyxl"]   # read/write BOM .xlsx (bom_assembly, datasheet BOM export, release-prep)

[project.scripts]
kb = "kicad_bench.main:main"

[tool.setuptools.packages.find]
include = ["kicad_bench*"]

[tool.setuptools.package-data]
kicad_bench = ["templates/*.yml", "templates/*.yaml"]
