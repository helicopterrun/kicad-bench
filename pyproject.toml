[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-bench"
version = "0.1.0"
description = "Generic, config-driven KiCad-10 workflow & PCB-design workbench (read-first quality gates + layout/DFM prep)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "helicopterrun" }]
# Lightweight core: KiCad work is done by shelling out to `kicad-cli`, and files are
# read with stdlib (tomllib, xml, re) — so the base install stays dependency-free and
# stays a safe leaf for consumers (e.g. the cockpit). Features that genuinely need a
# third-party library declare it as an optional extra below rather than importing it
# undeclared; install with e.g. `pip install kicad-bench[xlsx]`.
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl"]   # read/write BOM .xlsx (bom_assembly, datasheet BOM export, release-prep)

[project.scripts]
kb = "kicad_bench.main:main"

[tool.setuptools.packages.find]
include = ["kicad_bench*"]

[tool.setuptools.package-data]
kicad_bench = ["templates/*.yml", "templates/*.yaml"]
