name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (dependency-free core + the xlsx extra for the BOM tests)
        run: pip install -e '.[xlsx]' pytest
      - name: Run tests
        run: pytest -q
