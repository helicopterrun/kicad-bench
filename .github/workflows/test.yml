name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (stdlib-only core; pytest + openpyxl for the optional BOM-xlsx tests)
        run: pip install -e . pytest openpyxl
      - name: Run tests
        run: pytest -q
